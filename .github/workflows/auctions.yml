name: Live residential auctions

on:
  schedule:
    - cron: '23 */6 * * *'
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/auctions.yml'
      - 'scripts/collect_auctions.mjs'
      - 'scripts/auctions/**'
      - 'assets/auctions.*'
  pull_request:
    paths:
      - '.github/workflows/auctions.yml'
      - 'scripts/collect_auctions.mjs'
      - 'scripts/auctions/**'
      - 'assets/auctions.*'
      - 'index.html'

permissions:
  contents: read

concurrency:
  group: auctions-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Offline parser, robots, normalization, deduplication and UI tests
        run: |
          node --test scripts/auctions/*.test.mjs
          node --check scripts/collect_auctions.mjs
          node --check assets/auctions.js

  collect:
    if: github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
      pages: write
    outputs:
      pages_type: ${{ steps.pages.outputs.type }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Collect permitted public factual metadata
        id: collect
        continue-on-error: true
        run: node scripts/collect_auctions.mjs
      - name: Validate generated snapshot
        run: |
          node --input-type=module -e "import fs from 'node:fs'; for (const f of ['lots','coverage']) { const x=JSON.parse(fs.readFileSync('data/auctions/'+f+'.json')); if(x.schema_version!==1) throw Error('Unsupported schema'); }"
      - name: Commit lots and coverage together on this branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/auctions/
          if ! git diff --cached --quiet; then
            git commit -m 'data: refresh live residential auctions and coverage'
            # Refuse a stale-base push rather than overwrite concurrent human changes.
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
      - name: Publish readable coverage in run summary
        if: always()
        run: cat data/auctions/coverage.md >> "$GITHUB_STEP_SUMMARY"
      - name: Refresh Pages when using legacy branch publishing
        id: pages
        if: github.ref_name == github.event.repository.default_branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TYPE=$(gh api "repos/$GITHUB_REPOSITORY/pages" --jq .build_type)
          echo "type=$TYPE" >> "$GITHUB_OUTPUT"
          if [ "$TYPE" = 'legacy' ]; then
            # GITHUB_TOKEN commits do not automatically trigger a legacy Pages build.
            gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds"
          fi
      - name: Surface complete feed failure after preserving diagnostics
        if: steps.collect.outcome == 'failure'
        run: exit 1

  deploy:
    if: needs.collect.outputs.pages_type == 'workflow' && github.ref_name == github.event.repository.default_branch
    needs: collect
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/configure-pages@v5
      - name: Stage static site only
        run: |
          mkdir _site
          cp index.html distressed.html *.json _site/
          cp -R assets comps data _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy updated Pages snapshot
        id: deployment
        uses: actions/deploy-pages@v4
